  <title>Dynavics MURDLE</title>

    :root{--g:#0a2f18;--a:#99f221;--line:#d5e7bb;}

    .wrap{max-width:900px;margin:40px auto;padding:20px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 2px 0 #e5f0d1}
    img{width:72px;height:72px}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
    .logo{display:flex;gap:10px;align-items:center}
    a{display:block;text-decoration:none;padding:14px;border:1px solid #c9deb6;border-radius:12px;background:#f3fce6;margin:8px 0;color:#0b3714}
    a:hover{background:#e5f7d6}
    h1{margin:0}
    .small{color:#3c5f3b}
    @media (max-width:700px){.cards{grid-template-columns:1fr}}
  </style>
</head>
